name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # sign build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Self-test
        run: swift build && .build/debug/TabSwitch selftest

      - name: Build app
        run: |
          V="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || V="0.0.0-dev"
          VERSION="$V" ./build.sh release

      # GitHub only supports attestations on public repos (for personal accounts).
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/') && !github.event.repository.private
        continue-on-error: true   # GitHub's attestation API is occasionally flaky; don't block the release
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build/TabSwitch-*.zip
            build/TabSwitch.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="build/TabSwitch.dmg $(ls build/TabSwitch-*.zip) build/checksums.sha256"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files --title "TabSwitch $GITHUB_REF_NAME" --generate-notes
          fi
